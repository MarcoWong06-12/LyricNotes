<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LyricNotes 完整封面与信息界面重做预览</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .lyric-motion {
            transition: transform 550ms cubic-bezier(0.22, 1, 0.36, 1), opacity 450ms ease, filter 450ms ease;
        }
        @keyframes vinyl-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .anim-spin-slow {
            animation: vinyl-spin 12s linear infinite;
        }
    </style>
</head>
<body class="bg-[#08080a] text-slate-100 min-h-screen flex flex-col font-sans antialiased overflow-x-hidden selection:bg-white selection:text-black">

    <!-- 顶部固定导航 -->
    <header class="sticky top-0 z-50 bg-[#08080a]/95 backdrop-blur-xl border-b border-white/5 px-4 py-3">
        <div class="flex items-center justify-between max-w-md mx-auto mb-2">
            <span class="text-xs font-bold tracking-wider uppercase text-white/50">完整封面 + 曲目信息 + 歌词</span>
            <span class="text-[10px] text-white/50 bg-white/10 px-2 py-0.5 rounded-full">3 种国外经典版式</span>
        </div>

        <!-- 3 大版式切换 -->
        <div class="grid grid-cols-3 gap-1 bg-white/[0.05] p-1 rounded-xl max-w-md mx-auto border border-white/5">
            <button onclick="setMode(1)" id="tab-1" class="py-2 rounded-lg text-xs font-bold bg-white text-black shadow-sm transition-all">
                A. 顶部精致封面
            </button>
            <button onclick="setMode(2)" id="tab-2" class="py-2 rounded-lg text-xs font-medium text-white/50 hover:text-white transition-all">
                B. 上大封面下歌词
            </button>
            <button onclick="setMode(3)" id="tab-3" class="py-2 rounded-lg text-xs font-medium text-white/50 hover:text-white transition-all">
                C. 艺术黑胶唱片
            </button>
        </div>
    </header>

    <!-- 手机模拟屏幕主展示区 -->
    <main class="flex-1 flex flex-col items-center justify-start p-3 sm:p-5 w-full max-w-md mx-auto">

        <!-- 当前版式说明 -->
        <div class="w-full bg-white/[0.03] border border-white/5 rounded-2xl p-3.5 mb-3">
            <h2 id="mode-title" class="text-xs font-bold text-white">版式 A · 顶部精致封面卡片 (Apple Music 经典态)</h2>
            <p id="mode-desc" class="text-[11px] text-white/50 mt-1 leading-relaxed">
                顶部保留一块 60×60dp 的高清圆角大封面，配有清晰大字曲名、歌手与专辑，下方大面积留给丝滑景深歌词，既清晰看封面又不抢歌词视线。
            </p>
        </div>

        <!-- 手机模拟屏幕容器 -->
        <div id="screen-container" class="w-full h-[640px] rounded-[36px] bg-[#0c0d11] border border-white/10 relative overflow-hidden shadow-2xl flex flex-col justify-between p-4 transition-colors duration-500">
            
            <!-- 极淡氛围底色 (由当前封面主色虚化衍生) -->
            <div id="ambient-bg" class="absolute inset-0 bg-gradient-to-b from-white/[0.05] via-transparent to-black pointer-events-none"></div>

            <!-- 1. 顶部/上半部：专辑封面与完整歌曲信息 (由 JS 切换呈现) -->
            <div id="meta-section" class="relative z-20">
                <!-- 动态注入封面与信息 -->
            </div>

            <!-- 2. 中下部：丝滑双语滚动歌词视口 -->
            <div id="lyrics-section" class="relative z-10 flex-1 my-2 overflow-hidden flex flex-col justify-center">
                <div id="lyrics-wrapper" class="lyric-motion space-y-5">
                    <!-- 歌词行动态注入 -->
                </div>
            </div>

            <!-- 3. 底部轻触测试栏 -->
            <div class="relative z-20 pt-2.5 border-t border-white/5 flex items-center justify-between text-xs">
                <span class="text-[11px] text-white/40">轻触换句测试中心锁定 ➔</span>
                <button onclick="nextStep()" class="px-3.5 py-1.5 rounded-full bg-white/10 active:bg-white/20 active:scale-95 text-white font-medium text-xs transition-all border border-white/10">
                    换下一句 ▶
                </button>
            </div>

        </div>

    </main>

    <script>
        const songInfo = {
            title: "Family Matters",
            artist: "Drake",
            album: "Certified Lover Boy (2024)",
            // 真实高清专辑封面质感图
            coverUrl: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&auto=format&fit=crop&q=80",
            lyrics: [
                {
                    orig: "Drop a fifty bag for the mob in the spot",
                    trans: "装满现金的钱袋，给我在场的帮派好友们挥洒"
                },
                {
                    orig: "Drop a fifty bag,\ntwenty-nine for the thot",
                    trans: "装满现金的钱袋，给29区我那最爱的舞女挥洒"
                },
                {
                    orig: "Uh, I was really, really tryna keep it PG",
                    trans: "我其实不想搞得那么少儿不宜，都是你们逼我下场"
                },
                {
                    orig: "I was really, really tryna keep it PG",
                    trans: "我其实不想搞得那么少儿不宜"
                },
                {
                    orig: "If you had a set, they'd give your ass a DP",
                    trans: "如果你真有地盘，他们早就把你打成筛子了"
                }
            ]
        };

        let currentMode = 1;
        let activeIndex = 1;

        function setMode(modeId) {
            currentMode = modeId;

            // 切换选项卡
            for (let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`tab-${i}`);
                if (i === modeId) {
                    btn.className = "py-2 rounded-lg text-xs font-bold bg-white text-black shadow-sm transition-all";
                } else {
                    btn.className = "py-2 rounded-lg text-xs font-medium text-white/50 hover:text-white transition-all";
                }
            }

            const title = document.getElementById('mode-title');
            const desc = document.getElementById('mode-desc');

            if (modeId === 1) {
                title.innerText = "版式 A · 顶部精致封面卡片 (Apple Music 经典态)";
                desc.innerText = "顶部保留 56×56dp 高清圆角封面 + 纯白大字曲名、歌手与专辑，下方大面积留给丝滑景深歌词。封面不抢戏，歌词沉浸看。";
            } else if (modeId === 2) {
                title.innerText = "版式 B · 上半部大封面海报 + 下半部歌词 (Spotify / 经典播放器态)";
                desc.innerText = "上部展示 100×100dp 居中大封面、居中大字曲名与进度条；下半部显示大字纯白滚动歌词，听歌、看封面、看歌词三不误！";
            } else {
                title.innerText = "版式 C · 黑胶唱片出鞘画册风 (TIDAL / Roon 艺术态)";
                desc.innerText = "左侧为精致黑胶封套，黑胶唱片优雅旋转探出半圈，配以极细瑞士无衬线排版，充满实体唱片收藏质感与仪式感。";
            }

            renderMeta();
            renderLyrics();
        }

        // 渲染封面与歌曲信息
        function renderMeta() {
            const container = document.getElementById('meta-section');
            if (currentMode === 1) {
                // 版式 A: 顶部精致横向卡片
                container.innerHTML = `
                    <div class="flex items-center justify-between bg-white/[0.04] border border-white/10 rounded-2xl p-2.5 backdrop-blur-md shadow-lg">
                        <div class="flex items-center gap-3">
                            <!-- 高清大封面 -->
                            <img src="${songInfo.coverUrl}" class="w-14 h-14 rounded-xl object-cover shadow-md border border-white/15" alt="Cover">
                            <div>
                                <div class="text-[15px] font-extrabold text-white tracking-tight">${songInfo.title}</div>
                                <div class="text-[12px] text-white/70 mt-0.5">${songInfo.artist}</div>
                                <div class="text-[10px] text-white/40 mt-0.5">${songInfo.album}</div>
                            </div>
                        </div>
                        <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-xs text-white/70 cursor-pointer">
                            ···
                        </div>
                    </div>
                `;
            } else if (currentMode === 2) {
                // 版式 B: 上半部大封面海报 + 居中信息
                container.innerHTML = `
                    <div class="flex flex-col items-center pt-2 pb-3 border-b border-white/5">
                        <!-- 100x100 大封面 -->
                        <div class="relative shadow-2xl">
                            <img src="${songInfo.coverUrl}" class="w-24 h-24 rounded-2xl object-cover shadow-2xl border border-white/20" alt="Cover">
                        </div>
                        <div class="text-center mt-2.5">
                            <div class="text-[16px] font-black text-white tracking-tight">${songInfo.title}</div>
                            <div class="text-[12px] text-white/60 mt-0.5 font-medium">${songInfo.artist} · ${songInfo.album}</div>
                        </div>
                        <!-- 极细播放进度条 -->
                        <div class="w-48 h-1 bg-white/15 rounded-full mt-3 overflow-hidden">
                            <div class="w-2/5 h-full bg-white rounded-full"></div>
                        </div>
                    </div>
                `;
            } else {
                // 版式 C: 艺术黑胶唱片出鞘
                container.innerHTML = `
                    <div class="flex items-center justify-between bg-white/[0.03] p-3 rounded-2xl border border-white/10">
                        <div class="flex items-center gap-4">
                            <!-- 唱片从封套探出 -->
                            <div class="relative w-16 h-14 flex items-center">
                                <!-- 封套 -->
                                <img src="${songInfo.coverUrl}" class="w-13 h-13 rounded-lg object-cover absolute left-0 z-20 shadow-xl border border-white/20" style="width: 52px; height: 52px;" alt="Cover">
                                <!-- 黑胶盘探出 -->
                                <div class="w-12 h-12 rounded-full bg-[#111116] border border-white/30 absolute right-0 z-10 anim-spin-slow flex items-center justify-center shadow-lg">
                                    <div class="w-4 h-4 rounded-full bg-white/20 flex items-center justify-center">
                                        <div class="w-1.5 h-1.5 rounded-full bg-black"></div>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <div class="text-[14px] font-black text-white tracking-wider uppercase">${songInfo.title}</div>
                                <div class="text-[11px] text-white/60 tracking-normal">${songInfo.artist}</div>
                                <div class="text-[9px] text-white/30 font-mono tracking-widest mt-0.5">HI-RES AUDIO 24-BIT</div>
                            </div>
                        </div>
                        <div class="text-white/40 text-xs px-2 py-1 rounded bg-white/5 border border-white/10">···</div>
                    </div>
                `;
            }
        }

        // 渲染歌词
        function renderLyrics() {
            const wrapper = document.getElementById('lyrics-wrapper');
            let html = '';

            songInfo.lyrics.forEach((item, idx) => {
                const isActive = (idx === activeIndex);
                const distance = Math.abs(idx - activeIndex);

                if (currentMode === 1) {
                    // 样式 A (Apple Music 景深流)
                    html += `
                        <div class="lyric-motion ${isActive ? 'scale-[1.03] pl-1' : 'scale-[0.96]'}">
                            <div class="${isActive ? 'opacity-100 filter-none' : (distance === 1 ? 'opacity-35 blur-[1px]' : 'opacity-15 blur-[2px]')}">
                                <div class="text-[17px] font-bold text-white leading-snug whitespace-pre-line">
                                    ${item.orig}
                                </div>
                                <div class="text-[12px] font-normal text-white/70 mt-1">
                                    ${item.trans}
                                </div>
                            </div>
                        </div>
                    `;
                } else if (currentMode === 2) {
                    // 样式 B (居中跟唱流)
                    html += `
                        <div class="lyric-motion text-center ${isActive ? 'scale-[1.05]' : 'scale-95'}">
                            <div class="${isActive ? 'opacity-100' : 'opacity-30'}">
                                <div class="text-[16px] font-extrabold ${isActive ? 'text-white' : 'text-white/50'} leading-tight whitespace-pre-line">
                                    ${item.orig}
                                </div>
                                <div class="text-[12px] font-normal ${isActive ? 'text-white/75' : 'text-white/30'} mt-1">
                                    ${item.trans}
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    // 样式 C (TIDAL 极简纯黑)
                    html += `
                        <div class="lyric-motion ${isActive ? 'translate-x-1.5' : ''}">
                            <div class="${isActive ? 'opacity-100' : (distance === 1 ? 'opacity-35' : 'opacity-15')}">
                                <div class="text-[16px] font-bold text-white tracking-wide leading-relaxed whitespace-pre-line">
                                    ${item.orig}
                                </div>
                                <div class="text-[12px] font-light text-white/60 mt-1">
                                    ${item.trans}
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            wrapper.innerHTML = html;
        }

        function nextStep() {
            activeIndex = (activeIndex + 1) % songInfo.lyrics.length;
            renderLyrics();
        }

        // 初始化
        setMode(1);
    </script>
</body>
</html>
