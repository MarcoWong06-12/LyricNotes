<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LyricNotes 纯净极简 UI 提案（告别花哨）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }

        /* 真实的 iOS 标准 550ms 三次贝塞尔缓动曲线 */
        .lyric-motion {
            transition: transform 550ms cubic-bezier(0.22, 1, 0.36, 1), opacity 450ms ease, filter 450ms ease;
        }
    </style>
</head>
<body class="bg-[#0b0b0e] text-slate-100 min-h-screen flex flex-col font-sans antialiased overflow-x-hidden">

    <!-- 顶部极简导航 -->
    <header class="sticky top-0 z-50 bg-[#0b0b0e]/90 backdrop-blur-md border-b border-white/5 px-4 py-3">
        <div class="flex items-center justify-between max-w-md mx-auto mb-2">
            <span class="text-xs font-bold tracking-wider uppercase text-white/50">LyricNotes · 纯净美学重塑</span>
            <span class="text-[11px] text-white/40 bg-white/5 px-2 py-0.5 rounded-full">零杂色 · 纯黑白灰阶</span>
        </div>

        <!-- 3 款纯净方案切换 -->
        <div class="grid grid-cols-3 gap-1 bg-white/[0.05] p-1 rounded-xl max-w-md mx-auto border border-white/5">
            <button onclick="selectScheme(1)" id="tab-1" class="py-1.5 rounded-lg text-xs font-semibold bg-white text-black shadow-sm transition-all">
                纯粹灰阶
            </button>
            <button onclick="selectScheme(2)" id="tab-2" class="py-1.5 rounded-lg text-xs font-medium text-white/50 hover:text-white transition-all">
                杂志留白
            </button>
            <button onclick="selectScheme(3)" id="tab-3" class="py-1.5 rounded-lg text-xs font-medium text-white/50 hover:text-white transition-all">
                呼吸虚化
            </button>
        </div>
    </header>

    <!-- 主展示区 -->
    <main class="flex-1 flex flex-col items-center justify-start p-3 sm:p-5 w-full max-w-md mx-auto">

        <!-- 方案简述 -->
        <div class="w-full bg-white/[0.03] border border-white/5 rounded-2xl p-3 mb-3">
            <div class="flex items-center justify-between">
                <h2 id="scheme-title" class="text-xs font-bold text-white">方案 1 · 纯粹灰阶 (Pure Monochrome)</h2>
                <span id="scheme-tag" class="text-[10px] text-white/40">100% 纯白与多阶通透灰</span>
            </div>
            <p id="scheme-desc" class="text-[11px] text-white/50 mt-1 leading-relaxed">
                彻底移除了所有绿色、紫色与花哨图标。当前句为 100% 纯白，译文为 75% 柔白，未播行为 20% 幽暗灰。克制、沉稳、永不审美疲劳。
            </p>
        </div>

        <!-- 手机模拟屏幕容器 -->
        <div class="w-full h-[620px] rounded-[36px] bg-[#0d0d11] border border-white/10 relative overflow-hidden shadow-2xl flex flex-col justify-between p-5">
            
            <!-- 极淡深空氛围底色 (非高饱和杂色) -->
            <div class="absolute inset-0 bg-gradient-to-b from-white/[0.03] via-transparent to-black pointer-events-none"></div>

            <!-- 1. 顶部栏 (各方案独有) -->
            <div id="view-header" class="relative z-20">
                <!-- 由 JS 渲染 -->
            </div>

            <!-- 2. 歌词视口核心区 -->
            <div class="relative z-10 flex-1 my-2 overflow-hidden flex flex-col justify-center">
                <div id="lyric-list" class="lyric-motion space-y-5">
                    <!-- 动态歌词行注入 -->
                </div>
            </div>

            <!-- 3. 底部极简触控条 -->
            <div class="relative z-20 pt-3 border-t border-white/5 flex items-center justify-between">
                <span class="text-[11px] text-white/40">实测丝滑中心锁定 ➔</span>
                <button onclick="advanceLyric()" class="px-4 py-1.5 rounded-full bg-white/10 active:bg-white/20 active:scale-95 text-xs text-white font-medium transition-all border border-white/10">
                    换下一句 ▶
                </button>
            </div>

        </div>

        <!-- 丝滑换行说明 -->
        <div class="w-full mt-3 p-3 bg-white/[0.02] border border-white/5 rounded-2xl text-[11px] text-white/50 leading-relaxed">
            💡 <strong>点击右下角「换下一句」测试</strong>：每句歌词的视觉重心绝对不会上下乱窜，以稳定的几何中心平滑滑动，文字全为纯净白灰排版，告别一切刺眼杂色。
        </div>

    </main>

    <script>
        const songData = {
            title: "Family Matters",
            artist: "Drake",
            album: "Certified Lover Boy",
            lyrics: [
                {
                    orig: "Drop a fifty bag for the mob in the spot",
                    trans: "装满现金的钱袋，给我在场的帮派好友们挥洒"
                },
                {
                    orig: "Drop a fifty bag,\ntwenty-nine for the thot",
                    trans: "装满现金的钱袋，给29区我那最爱的舞女挥洒"
                },
                {
                    orig: "Uh, I was really, really tryna keep it PG",
                    trans: "我其实不想搞得那么少儿不宜，都是你们逼我下场"
                },
                {
                    orig: "I was really, really tryna keep it PG",
                    trans: "我其实不想搞得那么少儿不宜"
                },
                {
                    orig: "If you had a set, they'd give your ass a DP",
                    trans: "如果你真有地盘，他们早就把你打成筛子了"
                }
            ]
        };

        let currentScheme = 1;
        let activeIndex = 1;

        function selectScheme(id) {
            currentScheme = id;

            for (let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`tab-${i}`);
                if (i === id) {
                    btn.className = "py-1.5 rounded-lg text-xs font-semibold bg-white text-black shadow-sm transition-all";
                } else {
                    btn.className = "py-1.5 rounded-lg text-xs font-medium text-white/50 hover:text-white transition-all";
                }
            }

            const title = document.getElementById('scheme-title');
            const tag = document.getElementById('scheme-tag');
            const desc = document.getElementById('scheme-desc');

            if (id === 1) {
                title.innerText = "方案 1 · 纯粹灰阶 (Pure Monochrome)";
                tag.innerText = "100% 纯白与多阶通透灰";
                desc.innerText = "彻底移除了所有绿色、紫色与花哨图标。当前句为 100% 纯白，译文为 75% 柔白，未播行为 20% 幽暗灰。克制、沉稳、永不审美疲劳。";
            } else if (id === 2) {
                title.innerText = "方案 2 · 杂志留白 (Editorial Minimal)";
                tag.innerText = "北欧极简杂志风 · 大留白";
                desc.innerText = "顶部采用精巧细线分割，标题与作者采用超轻细体排版。歌词整齐靠左，当前句采用精致阶梯缩进，没有任何花哨装饰。";
            } else {
                title.innerText = "方案 3 · 呼吸虚化 (Focus Blur)";
                tag.innerText = "纯黑极简 · 景深柔焦虚化";
                desc.innerText = "全黑纯黑背景，视线仅锁定在中央活跃行。上下歌词带有渐进式高斯景深柔焦（非活跃行模糊褪去），呼吸感极佳。";
            }

            renderHeader();
            renderLyrics();
        }

        function renderHeader() {
            const h = document.getElementById('view-header');
            if (currentScheme === 1) {
                // 方案 1: 极简灰阶 Header (黑白无杂色)
                h.innerHTML = `
                    <div class="flex items-center justify-between py-1">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center border border-white/10">
                                <span class="w-2.5 h-2.5 rounded-full bg-white/70"></span>
                            </div>
                            <div>
                                <div class="text-[13px] font-bold text-white tracking-tight">${songData.title}</div>
                                <div class="text-[11px] text-white/40">${songData.artist}</div>
                            </div>
                        </div>
                        <div class="w-7 h-7 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-[11px] text-white/60">
                            ···
                        </div>
                    </div>
                `;
            } else if (currentScheme === 2) {
                // 方案 2: 杂志小字 Header
                h.innerHTML = `
                    <div class="flex items-center justify-between pb-2 border-b border-white/5">
                        <div class="flex items-baseline gap-2">
                            <span class="text-[14px] font-bold text-white tracking-tight">${songData.title}</span>
                            <span class="text-[11px] text-white/30 uppercase tracking-widest font-mono">${songData.artist}</span>
                        </div>
                        <span class="text-[10px] text-white/30 font-mono tracking-widest">LYRICNOTES</span>
                    </div>
                `;
            } else {
                // 方案 3: 极致隐形 Header (几乎无侵扰)
                h.innerHTML = `
                    <div class="flex items-center justify-between py-1">
                        <div class="text-[12px] font-medium text-white/50 tracking-wider">
                            ${songData.title} <span class="text-white/20">/</span> ${songData.artist}
                        </div>
                        <div class="w-2 h-2 rounded-full bg-white/30"></div>
                    </div>
                `;
            }
        }

        function renderLyrics() {
            const list = document.getElementById('lyric-list');
            let html = '';

            songData.lyrics.forEach((item, idx) => {
                const isActive = (idx === activeIndex);
                const distance = Math.abs(idx - activeIndex);

                if (currentScheme === 1) {
                    // 方案 1: 纯粹灰阶 (纯白加粗 + 柔白译文 + 幽暗灰未播)
                    html += `
                        <div class="lyric-motion ${isActive ? 'scale-[1.02] pl-1' : 'scale-95'}">
                            <div class="${isActive ? 'opacity-100' : (distance === 1 ? 'opacity-35' : 'opacity-15')}">
                                <div class="text-[17px] font-bold ${isActive ? 'text-white' : 'text-white/60'} leading-tight whitespace-pre-line tracking-tight">
                                    ${item.orig}
                                </div>
                                <div class="text-[13px] font-normal ${isActive ? 'text-white/70' : 'text-white/30'} mt-1">
                                    ${item.trans}
                                </div>
                            </div>
                        </div>
                    `;
                } else if (currentScheme === 2) {
                    // 方案 2: 杂志阶梯留白
                    html += `
                        <div class="lyric-motion ${isActive ? 'translate-x-2' : ''}">
                            <div class="${isActive ? 'opacity-100' : (distance === 1 ? 'opacity-30' : 'opacity-10')}">
                                <div class="text-[16px] font-extrabold ${isActive ? 'text-white' : 'text-white/50'} leading-tight whitespace-pre-line">
                                    ${item.orig}
                                </div>
                                <div class="text-[12px] font-light ${isActive ? 'text-white/65' : 'text-white/25'} mt-1">
                                    ${item.trans}
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    // 方案 3: 呼吸景深虚化
                    html += `
                        <div class="lyric-motion">
                            <div class="${isActive ? 'opacity-100 filter-none scale-100' : (distance === 1 ? 'opacity-35 blur-[1px] scale-95' : 'opacity-10 blur-[2px] scale-90')}">
                                <div class="text-[18px] font-bold text-white leading-tight whitespace-pre-line">
                                    ${item.orig}
                                </div>
                                <div class="text-[13px] font-normal text-white/70 mt-1">
                                    ${item.trans}
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            list.innerHTML = html;
        }

        function advanceLyric() {
            activeIndex = (activeIndex + 1) % songData.lyrics.length;
            renderLyrics();
        }

        // 初始化
        selectScheme(1);
    </script>
</body>
</html>
