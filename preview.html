<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>国外顶级音乐播放器 UI 哲学与实测</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .lyric-motion {
            transition: transform 550ms cubic-bezier(0.22, 1, 0.36, 1), opacity 450ms ease, filter 450ms ease;
        }
    </style>
</head>
<body class="bg-[#0a0a0c] text-slate-100 min-h-screen flex flex-col font-sans antialiased overflow-x-hidden">

    <!-- 顶部固定导航 -->
    <header class="sticky top-0 z-50 bg-[#0a0a0c]/90 backdrop-blur-md border-b border-white/5 px-4 py-3">
        <div class="flex items-center justify-between max-w-md mx-auto mb-2">
            <span class="text-xs font-bold tracking-wider uppercase text-white/50">海外主流播放器 UI 范式实测</span>
            <span class="text-[10px] text-white/40 bg-white/5 px-2 py-0.5 rounded-full">三大设计流派</span>
        </div>

        <!-- 3 大海外流派切换 -->
        <div class="grid grid-cols-3 gap-1 bg-white/[0.04] p-1 rounded-xl max-w-md mx-auto border border-white/5">
            <button onclick="selectPlayer(1)" id="tab-1" class="py-1.5 rounded-lg text-xs font-semibold bg-white text-black shadow-sm transition-all">
                Apple Music
            </button>
            <button onclick="selectPlayer(2)" id="tab-2" class="py-1.5 rounded-lg text-xs font-medium text-white/50 hover:text-white transition-all">
                Spotify 极简
            </button>
            <button onclick="selectPlayer(3)" id="tab-3" class="py-1.5 rounded-lg text-xs font-medium text-white/50 hover:text-white transition-all">
                TIDAL 纯黑
            </button>
        </div>
    </header>

    <!-- 主展示区 -->
    <main class="flex-1 flex flex-col items-center justify-start p-3 sm:p-5 w-full max-w-md mx-auto">

        <!-- 流派设计精髓说明 -->
        <div class="w-full bg-white/[0.03] border border-white/5 rounded-2xl p-3.5 mb-3">
            <div class="flex items-center justify-between">
                <h2 id="player-title" class="text-xs font-bold text-white">Apple Music · 电影级景深流 (Cinematic Depth)</h2>
                <span id="player-tag" class="text-[10px] text-white/40">业界公认视觉标杆</span>
            </div>
            <p id="player-desc" class="text-[11px] text-white/50 mt-1 leading-relaxed">
                柔和极暗弥散底色 + 大字纯白 + 景深柔焦（当前句锐利，前后句高斯虚化），视线极其沉浸，绝无杂色。
            </p>
        </div>

        <!-- 手机模拟屏幕容器 -->
        <div id="player-screen" class="w-full h-[620px] rounded-[36px] bg-[#0d0d12] border border-white/10 relative overflow-hidden shadow-2xl flex flex-col justify-between p-5 transition-colors duration-500">
            
            <!-- 动态环境底色 (各流派不同) -->
            <div id="ambient-layer" class="absolute inset-0 bg-gradient-to-b from-white/[0.04] via-transparent to-black pointer-events-none transition-all duration-700"></div>

            <!-- 1. 顶部栏 -->
            <div id="player-header" class="relative z-20">
                <!-- 由 JS 渲染 -->
            </div>

            <!-- 2. 歌词视口核心区 -->
            <div class="relative z-10 flex-1 my-2 overflow-hidden flex flex-col justify-center">
                <div id="player-lyrics" class="lyric-motion space-y-6">
                    <!-- 动态歌词行注入 -->
                </div>
            </div>

            <!-- 3. 底部极简触控条 -->
            <div class="relative z-20 pt-3 border-t border-white/5 flex items-center justify-between">
                <span class="text-[11px] text-white/40">实测丝滑中心锁定 ➔</span>
                <button onclick="advanceLyric()" class="px-4 py-1.5 rounded-full bg-white/10 active:bg-white/20 active:scale-95 text-xs text-white font-medium transition-all border border-white/10">
                    换下一句 ▶
                </button>
            </div>

        </div>

    </main>

    <script>
        const songData = {
            title: "Family Matters",
            artist: "Drake",
            lyrics: [
                {
                    orig: "Drop a fifty bag for the mob in the spot",
                    trans: "装满现金的钱袋，给我在场的帮派好友们挥洒"
                },
                {
                    orig: "Drop a fifty bag,\ntwenty-nine for the thot",
                    trans: "装满现金的钱袋，给29区我那最爱的舞女挥洒"
                },
                {
                    orig: "Uh, I was really, really tryna keep it PG",
                    trans: "我其实不想搞得那么少儿不宜，都是你们逼我下场"
                },
                {
                    orig: "I was really, really tryna keep it PG",
                    trans: "我其实不想搞得那么少儿不宜"
                },
                {
                    orig: "If you had a set, they'd give your ass a DP",
                    trans: "如果你真有地盘，他们早就把你打成筛子了"
                }
            ]
        };

        let currentPlayer = 1;
        let activeIndex = 1;

        function selectPlayer(id) {
            currentPlayer = id;

            for (let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`tab-${i}`);
                if (i === id) {
                    btn.className = "py-1.5 rounded-lg text-xs font-semibold bg-white text-black shadow-sm transition-all";
                } else {
                    btn.className = "py-1.5 rounded-lg text-xs font-medium text-white/50 hover:text-white transition-all";
                }
            }

            const title = document.getElementById('player-title');
            const tag = document.getElementById('player-tag');
            const desc = document.getElementById('player-desc');
            const screen = document.getElementById('player-screen');

            if (id === 1) {
                // Apple Music
                title.innerText = "Apple Music · 电影级景深流 (Cinematic Depth)";
                tag.innerText = "全球公认视觉标杆";
                desc.innerText = "柔和极暗弥散底色 + 大字号纯白 + 景深高斯柔焦虚化（未播行模糊淡出），视线如电影大光圈对焦，纯粹宁静。";
                screen.style.backgroundColor = "#0d0d12";
            } else if (id === 2) {
                // Spotify
                title.innerText = "Spotify · 结构化高对比流 (Structured High-Contrast)";
                tag.innerText = "紧凑跟唱 · 纯白与深墨灰";
                desc.innerText = "深碳黑背景（#121212）+ 紧凑左对齐。当前句纯白高亮，未播行深墨灰，绝不用任何彩色文字，跟唱节奏感极强。";
                screen.style.backgroundColor = "#121212";
            } else {
                // TIDAL
                title.innerText = "TIDAL · 瑞士极简工作室流 (Swiss Studio)";
                tag.innerText = "发烧级纯黑 OLED 奢华";
                desc.innerText = "100% OLED 纯黑（#000000）底色 + 瑞士国际平面排版风格。小字微型元数据，大字清晰锐利，无任何花哨渲染，克制到了极致。";
                screen.style.backgroundColor = "#000000";
            }

            renderHeader();
            renderLyrics();
        }

        function renderHeader() {
            const h = document.getElementById('player-header');
            if (currentPlayer === 1) {
                // Apple Music 风格：极简小圆角封面 + 纯白曲名与浅灰歌手
                h.innerHTML = `
                    <div class="flex items-center justify-between py-1">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center border border-white/10 shadow-lg">
                                <span class="w-3 h-3 rounded-full bg-white/70"></span>
                            </div>
                            <div>
                                <div class="text-[14px] font-bold text-white tracking-tight">${songData.title}</div>
                                <div class="text-[11px] text-white/50">${songData.artist}</div>
                            </div>
                        </div>
                        <div class="w-7 h-7 rounded-full bg-white/5 flex items-center justify-center text-[12px] text-white/60">
                            ···
                        </div>
                    </div>
                `;
            } else if (currentPlayer === 2) {
                // Spotify 风格：紧凑微型标题栏
                h.innerHTML = `
                    <div class="flex items-center justify-between py-1">
                        <div>
                            <div class="text-[13px] font-bold text-white">${songData.title}</div>
                            <div class="text-[11px] text-white/60">${songData.artist}</div>
                        </div>
                        <span class="text-[10px] font-bold text-white/40 tracking-wider">LYRICS</span>
                    </div>
                `;
            } else {
                // TIDAL 风格：瑞士极简微型排版
                h.innerHTML = `
                    <div class="flex items-baseline justify-between pb-2 border-b border-white/10">
                        <div class="flex items-baseline gap-2">
                            <span class="text-[13px] font-bold tracking-wider text-white uppercase">${songData.title}</span>
                            <span class="text-[10px] text-white/40 font-mono">${songData.artist}</span>
                        </div>
                        <span class="text-[9px] font-mono text-white/40 border border-white/20 px-1 rounded">MAX FLAC</span>
                    </div>
                `;
            }
        }

        function renderLyrics() {
            const list = document.getElementById('player-lyrics');
            let html = '';

            songData.lyrics.forEach((item, idx) => {
                const isActive = (idx === activeIndex);
                const distance = Math.abs(idx - activeIndex);

                if (currentPlayer === 1) {
                    // Apple Music: 大字纯白 + 景深柔焦 (未播句高斯模糊)
                    html += `
                        <div class="lyric-motion ${isActive ? 'scale-[1.03] pl-1' : 'scale-[0.96]'}">
                            <div class="${isActive ? 'opacity-100 filter-none' : (distance === 1 ? 'opacity-40 blur-[1px]' : 'opacity-15 blur-[2.5px]')}">
                                <div class="text-[18px] font-extrabold text-white leading-snug whitespace-pre-line tracking-tight">
                                    ${item.orig}
                                </div>
                                <div class="text-[13px] font-normal text-white/70 mt-1">
                                    ${item.trans}
                                </div>
                            </div>
                        </div>
                    `;
                } else if (currentPlayer === 2) {
                    // Spotify: 高对比 (当前句纯白加粗，未播句深墨灰，无模糊)
                    html += `
                        <div class="lyric-motion">
                            <div class="${isActive ? 'opacity-100' : 'opacity-30'}">
                                <div class="text-[16px] font-bold ${isActive ? 'text-white' : 'text-[#888888]'} leading-normal whitespace-pre-line">
                                    ${item.orig}
                                </div>
                                <div class="text-[12px] font-normal ${isActive ? 'text-white/80' : 'text-[#666666]'} mt-0.5">
                                    ${item.trans}
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    // TIDAL: 纯黑瑞士极简 (超清晰无衬线，字距稍宽，优雅沉稳)
                    html += `
                        <div class="lyric-motion ${isActive ? 'translate-x-1.5' : ''}">
                            <div class="${isActive ? 'opacity-100' : (distance === 1 ? 'opacity-35' : 'opacity-15')}">
                                <div class="text-[17px] font-bold text-white tracking-wide leading-relaxed whitespace-pre-line">
                                    ${item.orig}
                                </div>
                                <div class="text-[12px] font-light text-white/60 tracking-normal mt-1">
                                    ${item.trans}
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            list.innerHTML = html;
        }

        function advanceLyric() {
            activeIndex = (activeIndex + 1) % songData.lyrics.length;
            renderLyrics();
        }

        // 初始化
        selectPlayer(1);
    </script>
</body>
</html>
