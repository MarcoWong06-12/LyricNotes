name: Build LyricNotes APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug --stacktrace > build.log 2>&1 || {
            grep -E "e: " build.log | head -n 30 | while IFS= read -r line; do
              clean=$(echo "$line" | tr -d '\r')
              [ -n "$clean" ] && echo "::error title=KotlinError::$clean"
            done
            grep -E "(FAILED|AssertionError|expected:|<Click to see difference>)" build.log | head -n 30 | while IFS= read -r line; do
              clean=$(echo "$line" | tr -d '\r')
              [ -n "$clean" ] && echo "::error title=TestFailure::$clean"
            done
            grep -E "(What went wrong:|Caused by:)" build.log | head -n 10 | while IFS= read -r line; do
              clean=$(echo "$line" | tr -d '\r')
              [ -n "$clean" ] && echo "::error title=GradleFailure::$clean"
            done
            exit 1
          }

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LyricNotes-v1.0.0-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: LyricNotes ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Upload Failure Log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-log
          path: |
            build.log
            app/build/reports/tests/

