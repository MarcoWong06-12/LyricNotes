name: Build LyricNotes Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LyricNotes Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug & Release APKs + Run Unit Tests
        run: |
          gradle :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --continue --stacktrace > build.log 2>&1 || {
            grep -E "^e: " build.log | head -n 30 | while IFS= read -r line; do
              clean=$(echo "$line" | tr -d '\r')
              [ -n "$clean" ] && echo "::error title=KotlinError::$clean"
            done
            grep -E "FAILED$" build.log | head -n 20 | while IFS= read -r line; do
              clean=$(echo "$line" | tr -d '\r')
              [ -n "$clean" ] && echo "::error title=FailedTest::$clean"
            done
            python3 - <<'PY' || true
import glob, xml.etree.ElementTree as ET
for path in sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")):
    try:
        root = ET.parse(path).getroot()
        for tc in root.findall("testcase"):
            for tag in ("failure", "error"):
                el = tc.find(tag)
                if el is not None:
                    msg = (el.attrib.get("message") or el.text or "").replace("\n", " | ")[:300]
                    print(f"::error title=UnitTest::{tc.attrib.get('classname')}.{tc.attrib.get('name')} -> {msg}")
    except Exception as ex:
        print(f"::warning::Failed parsing {path}: {ex}")
PY
            grep -E "(What went wrong:|Caused by:|WARNING:|Missing class)" build.log | head -n 20 | while IFS= read -r line; do
              clean=$(echo "$line" | tr -d '\r')
              [ -n "$clean" ] && echo "::error title=GradleFailure::$clean"
            done
            exit 1
          }

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LyricNotes-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload Release APK to Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LyricNotes-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Upload Failure Log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-log
          path: build.log
