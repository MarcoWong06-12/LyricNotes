name: Build LyricNotes Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LyricNotes Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace > build.log 2>&1 || {
            grep -E "e: " build.log | head -n 30 | while IFS= read -r line; do
              clean=$(echo "$line" | tr -d '\r')
              [ -n "$clean" ] && echo "::error title=KotlinError::$clean"
            done
            grep -E "(What went wrong:|Caused by:)" build.log | head -n 10 | while IFS= read -r line; do
              clean=$(echo "$line" | tr -d '\r')
              [ -n "$clean" ] && echo "::error title=GradleFailure::$clean"
            done
            exit 1
          }

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LyricNotes-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload Failure Log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-log
          path: build.log
